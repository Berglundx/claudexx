name: Build apps

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover tests -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SMOKE: ${{ github.workspace }}/smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller tkinterdnd2 pystray Pillow
      - name: Build app
        run: python packaging/build.py

      - name: Locate built program
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "APP_BIN=$GITHUB_WORKSPACE/dist/C4DRenderGuard.exe" >> "$GITHUB_ENV"
          else
            echo "APP_BIN=$GITHUB_WORKSPACE/dist/C4D Render Guard.app/Contents/MacOS/C4D Render Guard" >> "$GITHUB_ENV"
          fi
          python tests/fakes.py "$SMOKE" | sed 's/^/FAKE_/' >> "$GITHUB_ENV"

      # The packaged app must render, survive a Cinema 4D crash and finish.
      - name: Smoke test - command line render with a crash
        shell: bash
        env:
          C4DGUARD_HOME: ${{ github.workspace }}/smoke/home
          FAKE_STATE: ${{ github.workspace }}/smoke
          FAKE_CRASH: "3"
        run: |
          "$APP_BIN" render "$SMOKE/proj/cli.c4d" -s 1 -e 6 --commandline "$FAKE_COMMANDLINE" --restart-delay 1
          ls "$SMOKE/proj/renders/cli"
          test "$(ls "$SMOKE/proj/renders/cli" | wc -l)" -eq 6

      # The default way of rendering: start the Cinema 4D app with the helper plugin.
      - name: Smoke test - open Cinema 4D and render (with a crash)
        shell: bash
        env:
          C4DGUARD_HOME: ${{ github.workspace }}/smoke/home
          FAKE_STATE: ${{ github.workspace }}/smoke
          FAKE_CRASH: "2"
        run: |
          export C4D_APP="$FAKE_APP"
          "$APP_BIN" render "$SMOKE/proj/app.c4d" -s 0 -e 5 --mode app --restart-delay 1
          ls "$SMOKE/proj/renders/app"
          test "$(ls "$SMOKE/proj/renders/app" | wc -l)" -eq 6

      # Opening the app must pick up a queued job and render it in the background.
      - name: Smoke test - window starts queued renders
        shell: bash
        env:
          C4DGUARD_HOME: ${{ github.workspace }}/smoke/home
          FAKE_STATE: ${{ github.workspace }}/smoke
        run: |
          export C4D_COMMANDLINE="$FAKE_COMMANDLINE" C4D_APP="$FAKE_APP"
          "$APP_BIN" add "$SMOKE/proj/gui.c4d" -s 0 -e 4
          "$APP_BIN" gui &
          for i in $(seq 1 90); do
            n=$( (ls "$SMOKE/proj/renders/gui" 2>/dev/null || true) | wc -l)
            [ "$n" -ge 5 ] && break
            sleep 2
          done
          ls "$SMOKE/proj/renders/gui"
          test "$(ls "$SMOKE/proj/renders/gui" | wc -l)" -eq 5

      - name: Check the tray icon came up
        if: runner.os == 'Windows'
        shell: bash
        run: grep "tray icon active" "$SMOKE/home/logs/guard.log"

      - name: Check version stamped in the exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $want = python -c "import c4dguard; print(c4dguard.__version__)"
          $got = (Get-Item $env:APP_BIN).VersionInfo.ProductVersion
          Write-Host "exe version: $got (expected $want)"
          if ($got -ne $want) { exit 1 }

      - name: Smoke test - resume-after-restart entry
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:APP_BIN autostart install | Out-Null; Start-Sleep 3
          $v = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').'C4D Render Guard'
          Write-Host "Run entry: $v"
          if ($v -notlike '*C4DRenderGuard.exe*run --keep-alive*') { exit 1 }
          & $env:APP_BIN autostart uninstall | Out-Null; Start-Sleep 3
          $left = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').'C4D Render Guard'
          if ($left) { exit 1 }

      - name: Stop leftover processes
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //T //IM C4DRenderGuard.exe || true
          else pkill -f "C4D Render Guard" || true; fi

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = python -c "import c4dguard; print(c4dguard.__version__)"
          & $iscc "/DAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\C4DRenderGuard-Setup-$ver.exe")) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: C4DRenderGuard-${{ runner.os }}
          path: |
            dist/C4DRenderGuard-Setup-*.exe
            dist/C4DRenderGuard.exe
            dist/C4DRenderGuard-mac.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Read version
        run: echo "VERSION=$(python3 -c 'import c4dguard; print(c4dguard.__version__)')" >> "$GITHUB_ENV"
      - name: Remove the previous build's files from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes || true
      - name: Move the "latest" tag to this build
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: C4D Render Guard ${{ env.VERSION }} (latest build)
          prerelease: true
          files: artifacts/*
          body: |
            **Windows:** download **C4DRenderGuard-Setup-${{ env.VERSION }}.exe** and run it (no admin rights needed).
            Then drag .c4d files onto the desktop icon, into the window, or right-click a .c4d file →
            "Render with C4D Render Guard", and enter the frames to render.
            `C4DRenderGuard.exe` is the same program without installer.

            **Mac (Apple Silicon):** download **C4DRenderGuard-mac.zip**, unzip, move the app to Applications,
            then right-click it → Open the first time. Drag .c4d files onto the app or into its window.

            Version ${{ env.VERSION }}, built from ${{ github.sha }}.
